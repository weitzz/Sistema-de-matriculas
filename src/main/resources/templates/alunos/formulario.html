<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloFormulario})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('alunos')}"></header>
<main class="page-shell narrow-shell">
    <div class="breadcrumb"><a th:href="@{/alunos}">Alunos</a><span>/</span><span th:text="${tituloFormulario}">Novo aluno</span></div>
    <section class="form-card">
        <div class="form-heading">
            <div class="section-icon">A</div>
            <div><p class="eyebrow">DADOS DO ALUNO</p><h1 th:text="${tituloFormulario}">Novo aluno</h1><p>Preencha as informações para manter o cadastro atualizado.</p></div>
        </div>
        <form th:object="${aluno}" th:action="${aluno.id == null ? '/alunos/salvar' : '/alunos/' + aluno.id + '/atualizar'}" method="post" class="form-fields">
            <div class="field-group">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" th:field="*{nome}" placeholder="Ex.: Maria da Silva" autocomplete="name" autofocus>
                <small class="field-error" th:errors="*{nome}"></small>
            </div>
            <div class="field-row">
                <div class="field-group">
                    <label for="cpf">CPF</label>
                    <input id="cpf" type="text" th:field="*{cpf}" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off">
                    <small class="field-hint">Aceita CPF com ou sem pontuação.</small>
                    <small class="field-error" th:errors="*{cpf}"></small>
                </div>
                <div class="field-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" th:field="*{email}" placeholder="maria@email.com" autocomplete="email">
                    <small class="field-error" th:errors="*{email}"></small>
                </div>
            </div>
            <div class="form-actions">
                <a class="button button-quiet" th:href="@{/alunos}">Cancelar</a>
                <button class="button button-primary" type="submit" th:text="${textoBotao}">Cadastrar aluno</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
