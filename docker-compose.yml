services:
  app:
    build: .
    container_name: sistema-matricula
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/matricula_db
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    container_name: mongodb-matricula
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://localhost:27017/admin", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongodb_data:
